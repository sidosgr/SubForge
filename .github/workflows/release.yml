name: Build and publish Windows installer

on:
  push:
    branches: [main]
    paths:
      - src-tauri/tauri.conf.json
      - .github/workflows/release.yml
      - scripts/build.ps1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subforge-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected stable semantic version' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $version) { throw 'Frontend version mismatch' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install frontend dependencies
        run: npm ci
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Download pinned media tools and source notices
        shell: pwsh
        run: ./scripts/prepare-media.ps1
      - name: Test and build production installer
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify package and checksums
        run: node scripts/verify-installer.mjs
      - name: Publish release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          # Existing releases are immutable: never replace a published installer.
          gh release view "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This version already has a release; increment the app version' }
          gh release create "v$env:RELEASE_VERSION" artifacts/SubForge-Setup-x64.exe artifacts/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "SubForge $env:RELEASE_VERSION" --notes-file RELEASE.md --latest
          if ($LASTEXITCODE) { throw 'Release publication failed' }
