[package]
name = "subforge"
version = "0.1.6"
edition = "2021"
authors = ["Sidos <info@sidos.gr>"]
description = "Subtitles forged from your videos"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
encoding_rs = "0.8"
base64 = "0.22"
keyring = { version = "3.6", features = ["windows-native"] }
winreg = "0.55"
futures-util = "0.3"
zip = { version = "6", default-features = false, features = ["deflate"] }
portable-pty = "0.9"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
